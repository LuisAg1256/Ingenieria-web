<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Turismo Comunitario</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <div class="login-wrapper fade-in">
        <div class="login-card">
            <div class="logoLogin"></div>

            <h2>Bienvenido</h2>
            <p class="sub">Inicia sesión para continuar</p>

            <form id="formLogin">
                <div class="input-group">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" placeholder="Ingresa tu correo" required>
                </div>

                <div class="input-group">
                    <label for="contra">Contraseña</label>
                    <input type="password" id="contra" placeholder="Ingresa tu contraseña" required>
                </div>

                <button type="submit" class="btn-login">Ingresar</button>
            </form>

            <p id="mensajeError" class="mensaje-error"></p>
        </div>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
